<!doctype html>
<html lang="en">
<head>

<title>DocFlow</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">DocFlow <span>upload &rarr; process &rarr; billing &rarr; payment</span></div>
  <nav id="tabs">
    <button data-tab="upload">Upload</button>
    <button data-tab="records">Records <b id="recCount" class="count"></b></button>
    <button data-tab="billing">Billing <b id="docCount" class="count"></b></button>

    <button data-tab="parties">Parties</button>

<main id="view"></main>
<div id="toast" role="alert" hidden></div>

<script src="app.js"></script>
